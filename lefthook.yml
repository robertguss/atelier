pre-commit:
  jobs:
    - run: pnpm exec ultracite fix {staged_files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.mjs"
        - "*.cjs"
        - "*.ts"
        - "*.tsx"
        - "*.mts"
        - "*.cts"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.scss"
        - "*.less"
        - "*.vue"
        - "*.svelte"
        - "*.astro"
        - "*.html"
        - "*.md"
        - "*.mdx"
        - "*.yaml"
        - "*.yml"
        - "*.graphql"
        - "*.gql"
      stage_fixed: true

pre-push:
  piped: true
  jobs:
    - name: check
      run: pnpm check
    - name: typecheck and test
      run: pnpm exec turbo run typecheck test
